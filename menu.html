<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8dfd4">
<title>Restaurant Menu</title>
<style>
:root{--paper:#fbf7f0;--ink:#2c2925;--muted:#756c62;--line:#ddd0c0;--accent:#94764e}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#eee5da,#d9c8b6);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1040px;margin:auto;padding:24px 18px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{border:1px solid #ffffffa8;border-radius:999px;padding:11px 17px;background:#ffffff42;color:var(--ink);text-decoration:none;font-size:12px}
header{padding:42px 0 26px}
.eyebrow{text-transform:uppercase;letter-spacing:3px;color:var(--accent);font-size:10px;font-weight:700}
h1{font:400 clamp(34px,7vw,58px)/1.05 Georgia,serif;margin:12px 0}
.lead{color:var(--muted);line-height:1.65;font-size:14px;max-width:560px}
.tools{display:grid;gap:12px;margin:20px 0}
#search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fffdf8;font:inherit}
#categories{display:flex;gap:8px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:#ffffff6b;border-radius:999px;padding:9px 13px;font-size:12px;color:var(--ink)}
.cat.active{background:var(--ink);border-color:var(--ink);color:white}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.item{border:1px solid #ffffffb0;border-radius:20px;background:#fffaf2cc;overflow:hidden;box-shadow:0 14px 34px #51402a0b}
.item img{display:block;width:100%;height:190px;object-fit:cover;background:#e5d9cb}
.item-body{padding:17px}
.item-category{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);font-weight:700}
.item h2{font:400 23px/1.15 Georgia,serif;margin:9px 0}
.item p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.price{margin-top:15px;font-size:13px;font-weight:700}
.state{padding:30px 18px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);line-height:1.7}
footer{margin-top:36px;padding-top:20px;border-top:1px solid #ffffffa8;color:var(--muted);font-size:11px;line-height:1.7}
@media(max-width:520px){.wrap{padding:16px 14px 40px}.item img{height:170px}.top .pill{flex:1;text-align:center}}
</style>
</head>
<body>
<main class="wrap">
 <nav class="top">
  <a id="backLink" class="pill" href="index.html">← Back to restaurant</a>
  <a id="reserveLink" class="pill" href="index.html#reserve">Reserve a table</a>
 </nav>
 <header>
  <div class="eyebrow">Restaurant App · Menu</div>
  <h1 id="restaurantName">Restaurant Menu</h1>
  <p class="lead">Explore the dishes and drinks offered by this restaurant. Menu items and prices are managed by the restaurant owner.</p>
 </header>
 <div class="tools">
  <input id="search" type="search" placeholder="Search menu">
  <div id="categories"></div>
 </div>
 <div id="grid"><div class="state">Loading menu…</div></div>
 <footer>© 2026 Restaurant App · Independent restaurant booking platform</footer>
</main>
<script>
(function(){
 const API='https://fkztipofuahmxenisayd.supabase.co/functions/v1/guest-reservations';
 const params=new URLSearchParams(location.search);
 const slug=params.get('restaurant')||'my-restaurant';
 const valid=/^[a-z0-9][a-z0-9-]{1,48}$/.test(slug)?slug:'my-restaurant';
 document.getElementById('backLink').href='index.html?restaurant='+encodeURIComponent(valid);
 document.getElementById('reserveLink').href='index.html?restaurant='+encodeURIComponent(valid)+'#reserve';
 const grid=document.getElementById('grid'),cats=document.getElementById('categories'),search=document.getElementById('search');
 let items=[],selected='All',currency='TRY';
 const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
 function render(){
  const q=search.value.trim().toLowerCase();
  const filtered=items.filter(x=>(selected==='All'||x.category===selected)&&[x.name,x.description,x.category].join(' ').toLowerCase().includes(q));
  grid.replaceChildren();
  if(!filtered.length){grid.append(el('div','state',items.length?'No menu items match your search.':'This restaurant has not published its menu yet.'));return}
  for(const item of filtered){
   const card=el('article','item');
   if(item.image_url){const image=el('img');image.src=item.image_url;image.alt=item.name;image.loading='lazy';card.append(image)}
   const body=el('div','item-body');body.append(el('div','item-category',item.category||'Menu'));
   body.append(el('h2','',item.name));if(item.description)body.append(el('p','',item.description));
   const price=el('div','price',new Intl.NumberFormat(undefined,{style:'currency',currency:item.currency||currency}).format(Number(item.price||0)));
   body.append(price);card.append(body);grid.append(card);
  }
 }
 function renderCategories(){
  const values=['All',...new Set(items.map(x=>x.category).filter(Boolean))];
  cats.replaceChildren();
  for(const value of values){const b=el('button','cat'+(value===selected?' active':''),value);b.type='button';b.addEventListener('click',()=>{selected=value;renderCategories();render()});cats.append(b)}
 }
 search.addEventListener('input',render);
 fetch(API+'?'+new URLSearchParams({action:'menu',restaurant:valid}),{cache:'no-store'})
  .then(async response=>{const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Menu unavailable');return data})
  .then(data=>{items=data.items||[];currency=data.restaurant?.currency||'TRY';const name=data.restaurant?.name||'Restaurant Menu';document.getElementById('restaurantName').textContent=name;document.title=name+' · Menu';renderCategories();render()})
  .catch(()=>{grid.replaceChildren(el('div','state','The menu could not be loaded. Please try again later.'));});
})();
</script>
</body>
</html>
