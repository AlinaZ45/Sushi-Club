<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sushi Club · Staff</title>
<style>
:root{--ivory:#f7f2ea;--paper:#fffdf9;--ink:#171513;--muted:#6f675e;--gold:#9a6a2d;--gold-soft:#c8aa7b;--line:#ded2c1;--dark:#191714;--ok:#4e6757;--bad:#7e4e49;--soft:#f3ece2}
*{box-sizing:border-box}body{margin:0;background:#e7e1d8;color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}.phone{max-width:560px;min-height:100vh;margin:auto;background:var(--ivory);box-shadow:0 0 40px #00000018}.head{padding:32px 24px 23px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.86),rgba(255,255,255,0) 58%),var(--ivory);border-bottom:1px solid var(--line)}.brand{font-size:10px;letter-spacing:2.7px;font-weight:800}.head h1{font-family:Baskerville,"Palatino Linotype",Georgia,serif;font-size:38px;font-weight:400;margin:16px 0 6px}.head p{margin:0;color:var(--muted);font-size:12px}.wrap{padding:20px 20px 42px}.back{display:inline-block;margin:0 0 16px;color:var(--gold);text-decoration:none;font-size:11px;font-weight:800}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 10px 28px #3c2d1d0a}.eyebrow{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:1.8px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.top b{font-family:Baskerville,Georgia,serif;font-size:19px;font-weight:400}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row.three{grid-template-columns:1.25fr 1fr 1fr}label{display:block;margin:12px 0 6px;font-size:10px;font-weight:900;letter-spacing:.5px}input,select,textarea{width:100%;border:1px solid #d8ccbb;border-radius:9px;background:white;padding:12px;font:inherit;font-size:13px;color:var(--ink)}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border:0;border-radius:9px;padding:12px 14px;font-size:10px;font-weight:900;letter-spacing:.8px;cursor:pointer;text-align:center}.btn.dark{background:var(--dark);color:white}.btn.gold{background:var(--gold);color:white}.btn.light{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#f2e5e1;color:#6d413c;border:1px solid #ddc9c3}.btn.small{width:auto;min-height:34px;padding:8px 10px;font-size:9px}.note,.message{font-size:11px;line-height:1.5;color:var(--muted);margin:9px 0 0}.ok{color:var(--ok)}.err{color:var(--bad)}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.stat{background:#f4eee5;border:1px solid var(--line);border-radius:10px;padding:10px 5px;text-align:center}.stat b{display:block;font-size:18px}.stat span{display:block;margin-top:2px;font-size:8px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.tabs button{border:1px solid var(--line);border-radius:9px;background:#fffaf3;padding:10px 5px;font-size:9px;font-weight:900;cursor:pointer}.tabs button.on{background:var(--dark);color:white;border-color:var(--dark)}.booking{border-top:1px solid #eee4d8;padding:14px 0}.booking:first-child{border-top:0;padding-top:0}.booking:last-child{padding-bottom:0}.pill{font-size:8px;font-weight:900;text-transform:uppercase;padding:5px 7px;border:1px solid var(--line);border-radius:999px;height:max-content}.pill.confirmed,.pill.reconfirmed,.pill.seated{background:#edf2ed;color:#44574a}.pill.pending{background:#f8f0dd;color:#775f2a}.pill.declined,.pill.cancelled,.pill.no_show{background:#f2e5e1;color:#6f4944}.meta{font-size:10px;line-height:1.6;color:var(--muted);margin-top:6px}.assignment{margin-top:9px;padding:9px 10px;border:1px dashed var(--gold-soft);border-radius:9px;background:#fffaf3;font-size:10px;line-height:1.45}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.actions.three{grid-template-columns:repeat(3,1fr)}.actions button{border:1px solid var(--line);border-radius:8px;padding:9px 7px;background:#fff;font-size:9px;font-weight:900;cursor:pointer}.actions .primary{background:var(--dark);color:#fff;border-color:var(--dark)}.actions .danger{background:#f2e5e1;color:#6d413c}.slot{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #eee4d8}.slot:first-child{border-top:0}.slot small{color:var(--muted);line-height:1.35}.slot button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 9px;font-size:9px;font-weight:900;cursor:pointer}.slot button.open{background:#edf2ed;color:#44574a}.area-title{margin:3px 0 9px;font-size:10px;letter-spacing:1.3px;color:var(--gold);font-weight:900}.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.table-card{min-height:78px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.table-card b{font-family:Baskerville,Georgia,serif;font-size:18px;font-weight:400}.table-card small{font-size:9px;color:var(--muted)}.table-card.free{background:#fbfaf6}.table-card.used{background:#eee7dc;border-color:#cdbb9c}.table-card.blocked{opacity:.45}.table-card.selectable{cursor:pointer}.table-card.selected{outline:2px solid var(--gold);outline-offset:1px;background:#f7eddd}.table-card.disabled{opacity:.38;cursor:not-allowed}.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:9px 0 0;font-size:9px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#fff;border:1px solid var(--line)}.dot.used{background:#d8c8ad}.dot.selected{background:var(--gold)}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modalbox{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--ivory);border-radius:18px 18px 0 0;padding:20px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.modalhead h2{font-family:Baskerville,Georgia,serif;font-weight:400;margin:2px 0;font-size:28px}.x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}.seat-summary{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px}.muted{color:var(--muted)}@media(max-width:460px){.row,.row.three{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.table-grid{grid-template-columns:repeat(3,1fr)}.actions.three{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="phone">
  <header class="head"><div class="brand">DELTA HOTELS · SUSHI CLUB</div><h1>Staff App</h1><p>Reservations, table plan and live availability.</p></header>
  <div class="wrap">
    <a class="back" href="/">← Back to Guest App</a>

    <section id="authCard" class="card">
      <div class="eyebrow">STAFF SIGN IN</div>
      <label>E-MAIL</label><input id="email" type="email" autocomplete="username">
      <label>PASSWORD</label><input id="password" type="password" autocomplete="current-password">
      <button class="btn dark" id="loginBtn" style="margin-top:12px">SIGN IN</button>
      <button class="btn light" id="setupBtn" style="margin-top:8px">FIRST-TIME STAFF SETUP</button>
      <div id="authMessage" class="message"></div>
    </section>

    <section id="dashboard" class="hidden">
      <section class="card">
        <div class="top"><div><div class="eyebrow">SIGNED IN</div><b id="staffName">Sushi Club Staff</b></div><button class="btn light small" id="logoutBtn">SIGN OUT</button></div>
        <div class="row three">
          <div><label>DATE</label><input id="date" type="date"></div>
          <div><label>TIME</label><select id="timeFilter"></select></div>
          <div><label>STATUS</label><select id="status"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="reconfirmed">Reconfirmed</option><option value="seated">Seated</option><option value="completed">Completed</option><option value="no_show">No-show</option><option value="declined">Declined</option><option value="cancelled">Cancelled</option></select></div>
        </div>
        <div class="stats"><div class="stat"><b id="totalStat">0</b><span>Total</span></div><div class="stat"><b id="pendingStat">0</b><span>Pending</span></div><div class="stat"><b id="confirmedStat">0</b><span>Confirmed</span></div><div class="stat"><b id="paxStat">0</b><span>Guests</span></div></div>
        <div class="tabs"><button id="reqTab" class="on">RESERVATIONS</button><button id="tableTab">TABLES</button><button id="slotTab">AVAILABILITY</button></div>
      </section>

      <section id="requestsCard" class="card"><div id="requests"></div></section>
      <section id="tablesCard" class="card hidden"><div id="tablesView"></div><div class="legend"><span><i class="dot"></i>Free</span><span><i class="dot used"></i>Assigned</span></div></section>
      <section id="slotsCard" class="card hidden"><div id="slots"></div></section>
    </section>
  </div>
</main>

<div id="assignModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalbox">
    <div class="modalhead"><div><div class="eyebrow">TABLE ASSIGNMENT</div><h2 id="assignTitle">Assign tables</h2><div id="assignMeta" class="meta"></div></div><button id="closeAssignBtn" class="x" aria-label="Close">×</button></div>
    <div id="assignGrid"></div>
    <div id="assignSeatSummary" class="seat-summary"></div>
    <div class="actions"><button id="autoAssignBtn">AUTO SELECT</button><button id="saveAssignBtn" class="primary">SAVE TABLES</button></div>
    <button id="clearAssignBtn" class="btn light" style="margin-top:8px">CLEAR ASSIGNMENT</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff.js"></script>
</body>
</html>
